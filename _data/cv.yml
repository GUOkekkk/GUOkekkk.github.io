    - title: IoT-Based Predictive Maintenance Platform for Spray-Painting Robots
      institution: ABB Robotics, Shanghai, China
      year: 2025-now
      description:
        - Developed and deployed a full-stack industrial IoT platform for robot data acquisition, real-time monitoring, and predictive maintenance using Docker-based microservices.
        - Built a high-throughput NATS pipeline for telemetry from robots, PLCs over OPC UA, and the Integrated Painting System.
        - Designed a pluggable algorithm pipeline and a React Flow interface for visual, drag-and-drop algorithm orchestration.
        - '<strong>Tech Stack:</strong> TypeScript, C#, Python, React, ASP.NET Core, FastAPI, NATS, PostgreSQL, TimescaleDB, Docker, Nginx, and Azure DevOps.'

    - title: MCP-Based Robot Control via ABB RWS
      institution: ABB Robotics, Shanghai, China
      year: MM/YYYY - MM/YYYY
      description:
        - Developed a Model Context Protocol server that exposes ABB Robot Web Services capabilities as standardized tools for AI agents.
        - Wrapped robot operations and status queries provided by RWS, enabling AI agents to monitor and control ABB industrial robots through natural-language workflows.
        - '<strong>Tech Stack:</strong> Python, MCP, ABB RWS, REST API, and AI Agents.'

    - title: Vision-Language-Action Model Training with Isaac Lab Synthetic Data
      institution: ABB Robotics, Shanghai, China
      year: 2026
      description:
        - Developed realistic robotic simulation environments in NVIDIA Isaac Lab and collected manipulation demonstrations as LeRobot datasets.
        - Trained and evaluated VLA models, including π0.5, in simulation before deployment to physical ABB industrial robots.
        - '<strong>Tech Stack:</strong> Python, LeRobot, NVIDIA Isaac Lab, and VLA.'

    - title: RAG-Based Internal Document Question-Answering System
      institution: ABB Robotics, Shanghai, China
      year: 2025
      description:
